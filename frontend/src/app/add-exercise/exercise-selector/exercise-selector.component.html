<div class="flex items-center space-x-4">
  <div>
    <select
      [(ngModel)]="selectedMuscleGroup"
      (change)="onMuscleGroupChange()"
      id="muscleGroupSelector"
      class="w-96 block rounded-lg border p-2.5 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white focus:ring-2 focus:ring-orange-500 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    >
      <option [value]="'Choose a Muscle Group'" selected disabled>
        Choose a Muscle Group
      </option>
      @for (muscle of muscleGroups; track muscle) {
        <option [value]="muscle">{{ muscle }}</option>
      }
    </select>
    <div class="flex mt-5">
      <select
        [(ngModel)]="selectedExercise"
        [disabled]="selectedMuscleGroup === 'Choose a Muscle Group'"
        id="exerciseSelector"
        class="w-96 block rounded-lg border p-2.5 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white focus:ring-2 focus:ring-orange-500 shadow-lg transition duration-500 ease-in-out transform"
        [ngClass]="{
          'hover:-translate-y-0.5 hover:scale-105':
            selectedMuscleGroup !== 'Choose a Muscle Group',
        }"
      >
        <option [value]="'Choose a Exercise'" selected>
          Choose a Exercise
        </option>
        @for (exercise of exercises; track exercise) {
          <option [value]="exercise">{{ exercise }}</option>
        }
      </select>
    </div>
  </div>
  <div class="ml-14">
    <form>
      <input
        [formControl]="sets"
        name="sets"
        id="setsInput"
        class="rounded-lg border p-2.5 text-sm bg-white text-black focus:ring-2 focus:ring-blue-500 w-48 mb-5 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
        type="number"
        placeholder="Number of Sets"
        aria-label="Number of Sets"
        min="1"
        step="1"
        (keydown)="preventInvalidCharacters($event)"
        (input)="checkMaxLength($event)"
      />
    </form>
    <button
      id="addExerciseButton"
      (click)="onAddExercise(selectedExercise)"
      [disabled]="
        selectedMuscleGroup === 'Choose a Muscle Group' ||
        selectedExercise === 'Choose a Exercise' ||
        !sets.value
      "
      class="rounded-lg border p-2.5 text-sm text-white w-48 shadow-lg transition duration-500 ease-in-out transform bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-700 hover:to-blue-900 hover:-translate-y-0.5 hover:scale-105 cursor-pointer"
      [class.opacity-50]="
        selectedMuscleGroup === 'Choose a Muscle Group' ||
        selectedExercise === 'Choose a Exercise' ||
        !sets.value
      "
      [class.pointer-events-none]="
        selectedMuscleGroup === 'Choose a Muscle Group' ||
        selectedExercise === 'Choose a Exercise' ||
        !sets.value
      "
    >
      Add Exercise
    </button>
  </div>
</div>
<div class="mt-8 flex space-x-4 justify-center">
  <button
    id="addNewExerciseButton"
    class="rounded-lg border w-36 p-2.5 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    (click)="openAddNewExerciseDialog()"
  >
    Add New Exercise
  </button>
  <button
    id="deleteExerciseButton"
    class="rounded-lg border w-36 p-2.5 text-sm bg-gradient-to-r from-orange-500 to-orange-700 text-white hover:from-orange-700 hover:to-orange-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    (click)="openDeleteExerciseDialog()"
  >
    Delete Exercise
  </button>
</div>
