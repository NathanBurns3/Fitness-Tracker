<body class="h-screen text-center bg-zinc-300 overflow-auto">
  <div
    class="body bg-neutral-50 rounded-lg shadow-2xl h-[calc(100vh-40px)] m-5 p-5"
  >
    <div #Title>
      <div class="min-h-[50px]">
        <div class="flex justify-between items-center relative">
          <button
            routerLink="/"
            class="button absolute left-4 bg-zinc-300 hover:bg-zinc-400 text-white font-bold py-2 px-4 rounded bg-gradient-to-r from-orange-500 to-orange-700"
          >
            <span>Back</span>
          </button>
          <div class="flex flex-grow justify-center">
            <h1 class="title-text text-6xl font-bold text-blue-800">
              Exercise
            </h1>
          </div>
        </div>
      </div>
    </div>

    <div #MainBody>
      <div class="main-body-grid grid grid-cols-2 gap-4 m-4">
        <div class="selector-image-grid grid col-span-1 gap-4">
          <div
            class="exercise-selector border border-zinc-300 rounded-lg shadow-lg flex items-center justify-center p-4"
          >
            <exercise-selector
              (muscleGroupChange)="onMuscleGroupChange($event)"
            ></exercise-selector>
          </div>
          <div
            class="exercise-image border border-zinc-300 rounded-lg shadow-lg h-[calc(100vh-377px)] p-4"
          >
            <exercise-image
              [selectedMuscleGroup]="selectedMuscleGroup"
            ></exercise-image>
          </div>
        </div>
        <div
          class="exercise-list border border-zinc-300 rounded-lg shadow-lg h-[calc(100vh-150px)] col-span-1 row-span-2 overflow-y-auto p-4"
        >
          <exercise-list></exercise-list>
        </div>
      </div>
    </div>
  </div>
</body>
