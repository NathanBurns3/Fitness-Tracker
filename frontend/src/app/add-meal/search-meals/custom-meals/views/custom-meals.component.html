@if (isLoading) {
  <div class="loading-overlay">
    <div class="spinner"></div>
  </div>
}
<div class="flex-col mx-auto my-2 items-center justify-center">
  <h1 class="title font-bold text-3xl text-blue-800">Custom Meals</h1>
  <button
    class="add-button mt-2 text-xs text-center rounded-3xl border py-1 px-3 text-white shadow-lg transition duration-500 ease-in-out transform bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-700 hover:to-blue-900 border-blue-900 hover:-translate-y-0.5 hover:scale-105 cursor-pointer"
    (click)="addCustomMeal()"
  >
    Add Custom Meal
  </button>
</div>
<div class="custom-list overflow-auto max-h-[calc(100vh-18rem)] pb-5">
  @for (meal of customMeals; track meal) {
    <div
      class="meal-tile bg-zinc-100 border border-zinc-300 mt-3 mx-6 p-4 rounded-lg shadow-md transition-all duration-200 transform hover:scale-105 hover:shadow-lg"
      (click)="openFoodDetails(meal)"
    >
      <h5 class="meal-title text-md font-bold text-blue-900 truncate">
        {{ meal.name }}
      </h5>
    </div>
  } @empty {
    <div
      class="bg-red-200 border border-red-400 text-red-700 px-3 py-2 rounded mt-3 mx-6"
      role="alert"
    >
      <strong class="font-bold">Warning!</strong><br />
      <span>No custom meals found.</span>
    </div>
  }
</div>
