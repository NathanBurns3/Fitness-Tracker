<div class="flex items-center justify-center min-h-screen bg-neutral-200">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <img
      src="assets/Logo-larger.png"
      alt="Logo"
      class="mx-auto mb-6 w-1/2 h-1/2 object-contain"
    />
    <h2 class="text-3xl font-bold text-blue-950 mb-6 text-center">Login</h2>
    <form (submit)="login()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-blue-800 mb-1"
          >Email</label
        >
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          required
          class="w-full px-4 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
      <div>
        <label
          for="password"
          class="block text-sm font-medium text-blue-800 mb-1"
          >Password</label
        >
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
          required
          class="w-full px-4 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="text-right">
        <button
          type="button"
          (click)="showForgotPassword()"
          class="text-sm text-orange-700 hover:text-orange-800 font-medium"
        >
          Forgot Password?
        </button>
      </div>

      <div>
        <button
          type="submit"
          class="w-full py-2 bg-gradient-to-r from-orange-500 to-orange-700 text-white font-semibold rounded-lg hover:from-orange-700 hover:to-orange-800 focus:outline-none focus:ring-2 focus:ring-orange-500"
        >
          Login
        </button>
      </div>
    </form>

    <!-- Forgot Password Form -->
    <div *ngIf="showForgotPasswordForm" class="mt-6 p-4 bg-gray-50 rounded-lg">
      <h3 class="text-lg font-semibold text-blue-950 mb-4">Reset Password</h3>
      <form (submit)="requestPasswordReset()" class="space-y-4">
        <div>
          <label
            for="resetEmail"
            class="block text-sm font-medium text-blue-800 mb-1"
            >Email</label
          >
          <input
            type="email"
            id="resetEmail"
            [(ngModel)]="resetEmail"
            name="resetEmail"
            placeholder="Enter your email"
            required
            class="w-full px-3 py-2 border border-zinc-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div class="flex space-x-2">
          <button
            type="submit"
            [disabled]="isRequestingReset"
            class="flex-1 py-2 bg-blue-950 text-white font-semibold rounded-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400"
          >
            <span *ngIf="isRequestingReset">Sending...</span>
            <span *ngIf="!isRequestingReset">Send Reset Link</span>
          </button>
          <button
            type="button"
            (click)="hideForgotPassword()"
            class="flex-1 py-2 bg-gray-500 text-white font-semibold rounded-lg hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>

    <p class="mt-6 text-center text-sm text-blue-800">
      Don't have an account?
      <a
        href="/signup"
        class="text-orange-700 hover:text-orange-800 font-medium"
        >Sign up</a
      >
    </p>
  </div>
</div>
