<div class="flex items-center justify-center min-h-screen bg-neutral-200">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-blue-950 mb-6 text-center">
      Reset Password
    </h2>

    <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
      <div class="mb-4">
        <label
          for="newPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >New Password</label
        >
        <div class="relative">
          <input
            type="{{ showPassword ? 'text' : 'password' }}"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter new password"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
          >
            <span *ngIf="showPassword">👁️</span>
            <span *ngIf="!showPassword">🙈</span>
          </button>
        </div>
      </div>

      <div class="mb-6">
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >Confirm Password</label
        >
        <div class="relative">
          <input
            type="{{ showConfirmPassword ? 'text' : 'password' }}"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Confirm new password"
          />
          <button
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
          >
            <span *ngIf="showConfirmPassword">👁️</span>
            <span *ngIf="!showConfirmPassword">🙈</span>
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading || !resetForm.valid"
        class="w-full px-4 py-2 bg-blue-950 text-white rounded hover:bg-blue-800 disabled:bg-gray-400 disabled:cursor-not-allowed mb-4"
      >
        <span *ngIf="isLoading">Resetting...</span>
        <span *ngIf="!isLoading">Reset Password</span>
      </button>

      <button
        type="button"
        (click)="goToLogin()"
        class="w-full px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
      >
        Back to Login
      </button>
    </form>
  </div>
</div>
