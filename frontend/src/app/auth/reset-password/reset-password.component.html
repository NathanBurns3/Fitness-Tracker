<div class="flex items-center justify-center min-h-screen bg-neutral-200">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-blue-950 mb-6 text-center">
      Reset Password
    </h2>

    <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
      <div class="mb-4">
        <label
          for="newPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >New Password</label
        >
        <div class="relative">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter new password"
          />
        </div>
      </div>

      <div class="mb-6">
        <label
          for="confirmPassword"
          class="block text-sm font-medium text-gray-700 mb-2"
          >Confirm Password</label
        >
        <div class="relative">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Confirm new password"
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading || !resetForm.valid"
        [class.opacity-50]="isLoading || !resetForm.valid"
        [class.pointer-events-none]="isLoading || !resetForm.valid"
        class="w-full px-4 py-2 bg-blue-500 border border-blue-750 shadow-sm rounded text-white hover:bg-blue-700 hover:border-blue-900 hover:shadow-md hover:scale-102 mb-4"
      >
        @if (isLoading) {
          <span>Resetting...</span>
        } @else {
          <span>Reset Password</span>
        }
      </button>

      <button
        type="button"
        (click)="goToLogin()"
        class="w-full px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600"
      >
        Back to Login
      </button>
    </form>
  </div>
</div>
