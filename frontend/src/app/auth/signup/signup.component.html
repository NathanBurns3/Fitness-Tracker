<body class="h-screen text-center bg-zinc-300 overflow-auto">
  <div
    class="content bg-neutral-50 rounded-lg shadow-2xl h-[calc(100vh-40px)] m-5 p-5"
  >
    @if (userSettings) {
      <div #Title>
        <div class="min-h-[40px] relative mt-5 -mb-4">
          <div class="flex justify-between items-center">
            @if (!mobile) {
              <div class="absolute left-5">
                <a
                  href="/login"
                  class="button rounded-lg border text-center p-2 w-20 mr-2 font-bold bg-gradient-to-r from-orange-500 to-orange-700 text-white hover:from-orange-700 hover:to-orange-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                >
                  Login
                </a>
              </div>
            }
            <h1
              class="title text-5xl font-bold text-blue-800 absolute left-1/2 transform -translate-x-1/2"
            >
              Signup
            </h1>
            @if (!mobile) {
              <div class="absolute right-5">
                <button
                  class="button rounded-lg border text-center p-2 w-20 mr-2 font-bold bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                  (click)="signup()"
                  [class.opacity-50]="
                    !userSettingsChanged || !pageValid || !passwordSet
                  "
                  [class.pointer-events-none]="
                    !userSettingsChanged || !pageValid || !passwordSet
                  "
                  [disabled]="
                    !userSettingsChanged || !pageValid || !passwordSet
                  "
                >
                  Signup
                </button>
              </div>
            }
          </div>
        </div>
      </div>

      <div class="sections m-4 grid grid-cols-8 h-[calc(100vh-8rem)]">
        <div class="section-1 col-span-5 mx-3">
          <div
            class="personal-information border border-zinc-300 rounded-lg shadow-lg col-span-5 p-4 h-[45%] mb-4"
          >
            <personal-information
              [originalPersonalInformation]="userSettings.personalInformation"
              (personalInformationChange)="updatePersonalInformation($event)"
            ></personal-information>
          </div>
          <div
            class="contact-information border border-zinc-300 rounded-lg shadow-lg col-span-5 p-4 h-[25%] mb-4"
          >
            <contact-information
              [originalContactInformation]="userSettings.contactInformation"
              (contactInformationChange)="updateContactInformation($event)"
            ></contact-information>
          </div>
          <div
            class="physical-measurements border border-zinc-300 rounded-lg shadow-lg col-span-8 p-4 h-[25%]"
          >
            <physical-measurements
              [originalPhysicalMeasurements]="userSettings.physicalMeasurements"
              (physicalMeasurementsChange)="updatePhysicalMeasurements($event)"
            ></physical-measurements>
          </div>
        </div>
        <div class="section-2 col-span-3 mx-3">
          <div
            class="activity-goal border border-zinc-300 rounded-lg shadow-lg col-span-3 p-4 h-[39%] mb-4"
          >
            <activity-goal
              [originalActivityGoal]="userSettings.activityGoal"
              (activityGoalChange)="updateActivityGoal($event)"
            ></activity-goal>
          </div>
          <div
            class="diet-selection border border-zinc-300 rounded-lg shadow-lg col-span-3 p-4 h-[20%] mb-4"
          >
            <diet-selection
              [originalDietSelection]="userSettings.dietPlan"
              (dietSelectionChange)="updateDietSelection($event)"
            ></diet-selection>
          </div>
          <div
            class="password-block border border-zinc-300 rounded-lg shadow-lg col-span-3 p-4 h-[36%]"
          >
            <h1 class="text-2xl font-bold text-blue-900 -mt-2">Password</h1>

            <div class="input-container">
              <div class="password flex flex-col items-center justify-center">
                <h1 class="sub-title text-lg font-bold text-blue-800 mb-1">
                  Password:
                </h1>
                <input
                  [(ngModel)]="password"
                  (ngModelChange)="updatePassword()"
                  class="password rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-48 mb-5 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                  type="password"
                  (focusout)="onPasswordFocusOut()"
                />
              </div>
              <div
                class="confirm-password flex flex-col items-center justify-center"
              >
                <h1 class="sub-title text-lg font-bold text-blue-800 mb-1">
                  Confirm Password:
                </h1>
                <input
                  [(ngModel)]="confirmPassword"
                  (ngModelChange)="updatePassword()"
                  class="confirm-password rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-48 mb-5 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                  type="password"
                  (focusout)="onConfirmPasswordFocusOut()"
                />
              </div>
            </div>
          </div>
          @if (mobile) {
            <div class="space-x-5 mb-5">
              <button
                class="rounded-lg border text-center p-2 w-20 font-bold bg-gradient-to-r from-orange-500 to-orange-700 text-white hover:from-orange-700 hover:to-orange-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                (click)="redirectToLogin()"
              >
                Login
              </button>
              <button
                class="rounded-lg border text-center p-2 w-20 font-bold bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
                (click)="signup()"
                [class.opacity-50]="
                  !userSettingsChanged || !pageValid || !passwordSet
                "
                [class.pointer-events-none]="
                  !userSettingsChanged || !pageValid || !passwordSet
                "
                [disabled]="!userSettingsChanged || !pageValid || !passwordSet"
              >
                Signup
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>
</body>
