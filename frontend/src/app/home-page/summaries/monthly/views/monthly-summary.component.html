<div *ngIf="isLoading" class="loading-overlay">
  <div class="spinner"></div>
</div>
<div class="container mx-auto p-4 -mt-4">
  <!-- Calendar Header -->
  <div class="flex justify-center items-center mb-4">
    <h1 class="text-2xl font-bold text-blue-950">
      {{ currentMonthYear }}
    </h1>
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7 gap-2">
    <!-- Weekday Headers -->
    <div class="text-center text-gray-500 font-semibold">Sun</div>
    <div class="text-center text-gray-500 font-semibold">Mon</div>
    <div class="text-center text-gray-500 font-semibold">Tue</div>
    <div class="text-center text-gray-500 font-semibold">Wed</div>
    <div class="text-center text-gray-500 font-semibold">Thu</div>
    <div class="text-center text-gray-500 font-semibold">Fri</div>
    <div class="text-center text-gray-500 font-semibold">Sat</div>

    <!-- Calendar Days -->
    <div
      *ngFor="let info of daysOfMonth"
      class="text-center rounded-lg"
      [ngClass]="{
        'border-2 border-gray-500': info.day === date.getDate(),
        'border border-gray-200': info.day !== date.getDate()
      }"
      [ngStyle]="{
        background:
          info.exerciseGoal && info.eatingGoal
            ? 'linear-gradient(to bottom right, rgba(59, 130, 246, 0.5) 50%, rgba(245, 124, 0, 0.5) 50%)'
            : info.exerciseGoal
            ? 'linear-gradient(to bottom right, rgba(59, 130, 246, 0.5) 50%, white 50%)'
            : info.eatingGoal
            ? 'linear-gradient(to bottom right, white 50%, rgba(245, 124, 0, 0.5) 50%)'
            : 'white'
      }"
    >
      {{ info.day ? info.day : "" }}
    </div>
  </div>
  <!-- Color Key -->
  <div class="mt-4 flex items-center">
    <div class="flex items-center mr-4">
      <div
        class="w-4 h-4 mr-2 rounded-full"
        style="background: rgba(59, 130, 246, 0.5)"
      ></div>
      <div class="text-gray-600">Exercise Goal</div>
    </div>
    <div class="flex items-center">
      <div
        class="w-4 h-4 mr-2 rounded-full"
        style="background: rgba(245, 124, 0, 0.5)"
      ></div>
      <div class="text-gray-600">Eating Goal</div>
    </div>
  </div>
</div>

<div class="exercise mt-1" *ngIf="this.exercisePercentage.length > 0">
  <h1 class="font-bold text-2xl text-blue-950 mb-2">Monthly Breakdown</h1>
  <div #ExerciseBar *ngIf="!isSmallScreen()">
    <div class="relative pt-1 mx-5 flex justify-center">
      <div class="bg-gray-200 rounded-full w-full flex flex-row shadow-lg">
        <div
          *ngFor="let percentage of exercisePercentage; let i = index"
          [style.width.%]="percentage"
          [ngClass]="[
            colors[i % colors.length],
            i === 0 ? 'rounded-l-full' : '',
            i === exercisePercentage.length - 1 ? 'rounded-r-full' : ''
          ]"
          class="text-xs font-semibold text-center p-0.5 leading-none inline-block hover:bg-black hover:text-white transition-colors duration-200"
          (mouseover)="hoverIndex = i"
          (mouseout)="hoverIndex = -1"
        >
          {{ percentage }}%
        </div>
      </div>
    </div>
  </div>

  <canvas
    id="myChart"
    class="mx-auto"
    style="max-width: 250px"
    *ngIf="isSmallScreen()"
  ></canvas>

  <div class="relative pt-1 mx-5 flex justify-center">
    <div class="w-23/24">
      <div #ColorKey class="flex justify-center">
        <div class="flex flex-row flex-wrap justify-center">
          <div
            *ngFor="let exercise of exercises; let i = index"
            class="flex items-center mr-2 text-center"
            style="max-width: 100%"
          >
            <div [class]="colors[i % colors.length] + ' w-3 h-3 mr-1'"></div>
            <span
              class="text-xs font-semibold exercise-text"
              [class.bold]="i === hoverIndex"
              style="white-space: normal"
              >{{ exercise }}</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
