<h1 class="title text-2xl font-bold text-blue-900 -mt-2">Account Management</h1>
<div class="button-group flex h-full w-full justify-center items-center -mt-2">
  <div class="change-password flex flex-col items-center justify-center mr-12">
    <button
      class="button rounded-lg border p-2 w-40 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
      (click)="openUpdatePassword()"
    >
      Change Password
    </button>
  </div>

  <div class="flex flex-col items-center justify-center">
    <button
      class="button rounded-lg border p-2 w-40 text-sm bg-gradient-to-r from-orange-500 to-orange-700 text-white hover:from-orange-700 hover:to-orange-900 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
      (click)="openDeleteAccount()"
    >
      Delete Account
    </button>
  </div>
</div>
