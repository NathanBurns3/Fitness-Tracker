<div
  class="flex flex-row items-center justify-center text-center bg-gradient-to-r from-blue-500 to-blue-700 pb-3 shadow-lg"
>
  <h1 class="title text-3xl font-extrabold text-white mt-4">Delete Account</h1>
  <button
    class="absolute top-3 right-3 bg-red-500 hover:bg-red-700 text-xs font-medium py-1 px-2 rounded-full text-white"
    (click)="closeDeleteAccount()"
  >
    X
  </button>
</div>
<div class="grid place-items-center h-full mx-8 -mt-3">
  <h1 class="text-lg font-bold text-blue-800">
    Are you sure you want to delete this account?
  </h1>
</div>
<div class="flex justify-center mb-7">
  <button
    class="rounded-lg border p-2.5 w-20 mr-5 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    (click)="DeleteAccount()"
  >
    Confirm
  </button>
  <button
    class="rounded-lg border w-20 p-2.5 text-sm bg-gradient-to-r from-orange-500 to-orange-700 text-white hover:from-orange-700 hover:to-orange-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    (click)="closeDeleteAccount()"
  >
    Cancel
  </button>
</div>
