<h1 class="title text-2xl font-bold text-blue-900 -mt-2">
  Physical Measurements
</h1>

<div class="measurements flex h-full w-full justify-center items-center">
  <div class="flex flex-col items-center justify-center">
    <h1 class="sub-title text-lg font-bold text-blue-800 mb-1">Height:</h1>
    <div class="flex items-center space-x-4">
      <div class="flex items-center">
        <input
          [(ngModel)]="heightFeet"
          (ngModelChange)="updatePhysicalMeasurements()"
          (keypress)="numberOnly($event)"
          class="rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-14 mb-5 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105 text-right"
          type="number"
          placeholder="{{ heightFeet }}"
          min="0"
        />
        <h1 class="sub-title text-lg text-blue-800 ml-1 mb-5">ft</h1>
      </div>
      <div class="flex items-center">
        <input
          [(ngModel)]="heightInches"
          (ngModelChange)="updatePhysicalMeasurements()"
          (keypress)="numberOnly($event)"
          class="rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-14 mb-5 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105 text-right"
          type="number"
          placeholder="{{ heightInches }}"
          min="0"
        />
        <h1 class="sub-title text-lg text-blue-800 ml-1 mb-5">in</h1>
      </div>
    </div>
  </div>

  <div class="weight-selector ml-20">
    <h1 class="sub-title text-lg font-bold text-blue-800 mb-1">Weight:</h1>
    <div class="weight flex items-center">
      <input
        [(ngModel)]="physicalMeasurements.weight"
        (ngModelChange)="updatePhysicalMeasurements()"
        (keypress)="numberOnly($event)"
        class="rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-16 mb-5 shadow-sm transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105 text-right"
        type="number"
        placeholder="{{ physicalMeasurements.weight }}"
        min="0"
      />
      <h1 class="sub-title text-lg text-blue-800 ml-1 mb-5">lbs</h1>
    </div>
  </div>
</div>
