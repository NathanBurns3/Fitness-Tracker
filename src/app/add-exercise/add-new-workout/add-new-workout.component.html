<div
  class="flex flex-row items-center justify-center text-center bg-gradient-to-r from-blue-500 to-blue-700 pb-3 shadow-lg"
>
  <h1 class="text-4xl font-extrabold text-white mt-4">Add New Workout</h1>
  <button
    class="absolute top-3 right-3 bg-red-500 hover:bg-red-700 text-xs font-medium py-1 px-2 rounded-full text-white"
    (click)="closeAddNewWorkout()"
  >
    X
  </button>
</div>

<div class="grid place-items-center h-full -mt-3">
  <div class="flex flex-col items-start bg-white p-5 rounded-lg shadow-lg">
    <h1 class="text-lg font-bold text-blue-800 mb-2">Muscle Group:</h1>
    <select
      [(ngModel)]="muscleGroup"
      class="w-full block rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105 mb-10"
    >
      <option [value]="'Choose a Muscle Group'" selected disabled>
        Choose a Muscle Group
      </option>
      <option *ngFor="let muscle of muscleGroups" [value]="muscle">
        {{ muscle }}
      </option>
    </select>

    <h1 class="text-lg font-bold text-blue-800 mb-2">Exercise:</h1>
    <form>
      <input
        [(ngModel)]="workout"
        name="sets"
        class="rounded-lg border p-2.5 text-sm bg-white text-blue-950 focus:ring-2 focus:ring-blue-500 w-48 mb-5 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
        type="text"
        placeholder="Exercise Name"
        aria-label="Exercise Name"
      />
    </form>
  </div>
</div>

<div class="flex justify-center mb-8">
  <button
    class="rounded-lg border p-2.5 w-32 mr-2 text-sm bg-gradient-to-r from-blue-500 to-blue-700 text-white hover:from-blue-700 hover:to-blue-900 shadow-lg transition duration-500 ease-in-out transform hover:-translate-y-0.5 hover:scale-105"
    (click)="saveWorkout()"
  >
    Save Exercise
  </button>
</div>
