<body class="h-screen text-center bg-zinc-300 overflow-auto">
  <div class="bg-neutral-50 rounded-lg shadow-2xl h-[calc(100vh-40px)] m-5 p-5">
    <div #Title>
      <div class="min-h-[50px]">
        <div class="flex justify-between items-center relative">
          <button
            routerLink="/"
            class="button absolute left-4 bg-zinc-300 hover:bg-zinc-400 text-white font-bold py-2 px-4 rounded bg-gradient-to-r from-orange-500 to-orange-700"
          >
            <span>Back</span>
          </button>
          <div class="flex flex-grow justify-center">
            <h1 class="text-6xl font-bold text-blue-800">Exercise</h1>
          </div>
        </div>
      </div>
    </div>

    <div #MainBody>
      <div class="grid grid-cols-8 gap-4 m-4">
        <div
          class="border border-zinc-300 rounded-lg shadow-lg h-[calc(100vh-150px)] col-span-4 row-span-2 overflow-y-auto p-4"
        >
          <workout-list></workout-list>
        </div>
        <div
          class="border border-zinc-300 rounded-lg shadow-lg col-span-4 flex items-center justify-center p-4"
        >
          <workout-selector
            (muscleGroupChange)="onMuscleGroupChange($event)"
          ></workout-selector>
        </div>
        <div
          class="border border-zinc-300 rounded-lg shadow-lg min-h-[400px] col-span-4 p-4"
        >
          <workout-image
            [selectedMuscleGroup]="selectedMuscleGroup"
          ></workout-image>
        </div>
      </div>
    </div>
  </div>
</body>
