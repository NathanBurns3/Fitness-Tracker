<h1 class="text-center text-3xl font-extrabold text-blue-800 mt-4 mb-6">
  Workouts Completed Today
</h1>

<div class="overflow-auto max-h-[calc(100vh-16.75rem)]">
  <div
    *ngFor="let workout of workouts"
    class="bg-gradient-to-r from-blue-500 to-blue-700 border border-blue-900 rounded-lg shadow-md p-4 my-4 mx-6 flex items-center justify-between"
  >
    <h1 class="text-xl font-bold text-white">{{ workout.exerciseName }}</h1>
    <h1 class="text-xl font-bold text-white">x{{ workout.sets }}</h1>
  </div>
</div>
