<h1 class="text-center text-3xl font-extrabold text-blue-600 mt-4 mb-6">
  Workouts Completed Today
</h1>

<div class="overflow-auto max-h-[calc(100vh-14.25rem)]">
  <div
    *ngFor="let workout of workouts"
    class="bg-gradient-to-r from-blue-100 via-blue-200 to-blue-300 border border-blue-400 rounded-lg shadow-md p-4 my-4 mx-6 flex items-center justify-between"
  >
    <h1 class="text-xl font-bold text-blue-800">{{ workout.exerciseName }}</h1>
    <h1 class="text-xl font-bold text-blue-800">x{{ workout.sets }}</h1>
  </div>
</div>
