<div #Exercise>
  <h1 class="font-bold text-2xl text-blue-950">Exercise</h1>
  <div #ExerciseBar>
    <div class="relative pt-1 mx-5 flex justify-center">
      <div
        class="bg-gray-200 rounded-full dark:bg-gray-700 w-full flex flex-row shadow-lg"
      >
        <div
          *ngFor="let percentage of exercisePercentage; let i = index"
          [style.width.%]="percentage"
          [ngClass]="[
            colors[i % colors.length],
            i === 0 ? 'rounded-l-full' : '',
            i === exercisePercentage.length - 1 ? 'rounded-r-full' : ''
          ]"
          class="text-xs font-semibold text-center p-0.5 leading-none inline-block hover:bg-black hover:text-white transition-colors duration-200"
          (mouseover)="hoverIndex = i"
          (mouseout)="hoverIndex = -1"
        >
          {{ percentage }}%
        </div>
      </div>
    </div>
  </div>
  <div class="relative pt-1 mx-5 flex justify-center">
    <div class="w-10/12">
      <div #ColorKey class="flex justify-center">
        <div class="flex flex-row">
          <div
            *ngFor="let exercise of exercises; let i = index"
            class="flex items-center mr-2"
          >
            <div [class]="colors[i % colors.length] + ' w-3 h-3 mr-1'"></div>
            <span
              class="text-xs font-semibold"
              [class.bold]="i === hoverIndex"
              >{{ exercise }}</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div #Eating class="mt-5">
  <h1 class="font-bold text-2xl text-blue-950 -mb-3">Eating Goals</h1>
  <div *ngFor="let macro of macros; let i = index" class="mx-5 mb-2">
    <h1 class="text-left mb-1 font-semibold">{{ macro }}</h1>
    <div class="flex justify-center">
      <div class="bg-gray-200 rounded-full dark:bg-gray-300 w-full shadow-3xl">
        <div
          [class]="
            eatingPercentage[i] > 100
              ? 'bg-gradient-to-r from-red-500 to-red-700 hover:from-red-700 hover:to-red-900 text-xs font-semibold text-red-100 text-center p-0.5 leading-none rounded-full'
              : 'bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-700 hover:to-blue-900 text-xs font-semibold text-blue-100 text-center p-0.5 leading-none rounded-full'
          "
          [style.width]="
            eatingPercentage[i] > 100 ? '100%' : eatingPercentage[i] + '%'
          "
          class="transition-width duration-200"
        >
          {{ eatingPercentage[i] }}%
        </div>
      </div>
    </div>
  </div>
</div>
