<div class="container mx-auto p-4">
  <!-- Calendar Header -->
  <div class="flex justify-center items-center mb-4">
    <h1 class="text-xl font-semibold">{{ currentMonthYear }}</h1>
  </div>

  <!-- Calendar Grid -->
  <div class="grid grid-cols-7 gap-2">
    <!-- Weekday Headers -->
    <div class="text-center text-gray-600">Sun</div>
    <div class="text-center text-gray-600">Mon</div>
    <div class="text-center text-gray-600">Tue</div>
    <div class="text-center text-gray-600">Wed</div>
    <div class="text-center text-gray-600">Thu</div>
    <div class="text-center text-gray-600">Fri</div>
    <div class="text-center text-gray-600">Sat</div>

    <!-- Calendar Days -->
    <!-- TODO: Replace this with dynamic generation of days -->
    <div
      *ngFor="let info of monthlyBreakdownInfo"
      class="text-center border"
      [ngStyle]="{
        background:
          info.exerciseGoal && info.eatingGoal
            ? 'linear-gradient(to bottom right, rgba(21, 101, 192, 0.5) 50%, rgba(245, 124, 0, 0.5) 50%)'
            : info.exerciseGoal
            ? 'linear-gradient(to bottom right, rgba(21, 101, 192, 0.5) 50%, white 50%)'
            : info.eatingGoal
            ? 'linear-gradient(to bottom right, white 50%, rgba(245, 124, 0, 0.5) 50%)'
            : 'white'
      }"
    >
      {{ info.day }}
    </div>
  </div>
  <!-- Color Key -->
  <div class="mt-4 flex items-center">
    <div class="flex items-center mr-4">
      <div
        class="w-4 h-4 mr-2"
        style="background: rgba(21, 101, 192, 0.5)"
      ></div>
      <div>Exercice Goal</div>
    </div>
    <div class="flex items-center">
      <div
        class="w-4 h-4 mr-2"
        style="background: rgba(245, 124, 0, 0.5)"
      ></div>
      <div>Eating Goal</div>
    </div>
  </div>
</div>

<div #Exercise class="mt-10">
  <h1 class="mb-2 font-semibold">Monthly Breakdown</h1>
  <div #ExerciseBar>
    <div class="relative pt-1 mx-5 flex justify-center">
      <div
        class="bg-gray-200 rounded-full dark:bg-gray-700 w-full flex flex-row"
      >
        <div
          *ngFor="let percentage of exercisePercentage; let i = index"
          [style.width.%]="percentage"
          [ngClass]="[
            colors[i % colors.length],
            i === 0 ? 'rounded-l-full' : '',
            i === exercisePercentage.length - 1 ? 'rounded-r-full' : ''
          ]"
          class="text-xs font-medium text-center p-0.5 leading-none inline-block"
        >
          {{ percentage }}%
        </div>
      </div>
    </div>
  </div>
  <div class="relative pt-1 mx-5 flex justify-center mb-4">
    <div class="w-10/12">
      <div #ColorKey class="flex justify-center">
        <div class="flex flex-row">
          <div
            *ngFor="let exercise of exercises; let i = index"
            class="flex items-center mr-2"
          >
            <div [class]="colors[i % colors.length] + ' w-3 h-3 mr-1'"></div>
            <span class="text-xs">{{ exercise }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
