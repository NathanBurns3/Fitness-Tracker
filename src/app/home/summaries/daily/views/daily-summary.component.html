<div #Exercise>
  <h1>Exercise</h1>
  <div #ExerciseBar>
    <div class="relative pt-1 mx-5 flex justify-center">
      <div
        class="bg-gray-200 rounded-full dark:bg-gray-700 w-full flex flex-row"
      >
        <div
          style="width: 10%"
          class="bg-red-500 text-xs font-medium text-red-100 text-center p-0.5 leading-none rounded-l-full inline-block"
        >
          10%
        </div>
        <div
          style="width: 15%"
          class="bg-blue-500 text-xs font-medium text-emerald-100 text-center p-0.5 leading-none inline-block"
        >
          15%
        </div>
        <div
          style="width: 20%"
          class="bg-yellow-500 text-xs font-medium text-emerald-100 text-center p-0.5 leading-none inline-block"
        >
          20%
        </div>
        <div
          style="width: 25%"
          class="bg-purple-500 text-xs font-medium text-emerald-100 text-center p-0.5 leading-none inline-block"
        >
          25%
        </div>
        <div
          style="width: 30%"
          class="bg-orange-500 text-xs font-medium text-orange-100 text-center p-0.5 leading-none rounded-r-full inline-block"
        >
          30%
        </div>
      </div>
    </div>
  </div>
  <div class="relative pt-1 mx-5 flex justify-center">
    <div class="w-10/12">
      <div #ColorKey class="flex justify-center">
        <div class="flex flex-row">
          <div class="flex items-center mr-4">
            <div class="w-3 h-3 bg-red-500 mr-2"></div>
            <span class="text-xs">Chest</span>
          </div>
          <div class="flex items-center mr-4">
            <div class="w-3 h-3 bg-blue-500 mr-2"></div>
            <span class="text-xs">Legs</span>
          </div>
          <div class="flex items-center mr-4">
            <div class="w-3 h-3 bg-yellow-500 mr-2"></div>
            <span class="text-xs">Shoulders</span>
          </div>
          <div class="flex items-center mr-4">
            <div class="w-3 h-3 bg-purple-500 mr-2"></div>
            <span class="text-xs">Arms</span>
          </div>
          <div class="flex items-center">
            <div class="w-3 h-3 bg-orange-500 mr-2"></div>
            <span class="text-xs">Back</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div #Eating class="mt-5">
  <h1>Eating Goals</h1>
  <div class="mx-5 mb-5">
    <h1 class="text-left mb-2">Calories</h1>
    <div class="flex justify-center">
      <div class="bg-gray-200 rounded-full dark:bg-gray-700 w-full">
        <div
          class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full"
          style="width: 45%"
        >
          45%
        </div>
      </div>
    </div>
  </div>
  <div class="mx-5 mb-5">
    <h1 class="text-left mb-2">Protein</h1>
    <div class="flex justify-center">
      <div class="bg-gray-200 rounded-full dark:bg-gray-700 w-full">
        <div
          class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full"
          style="width: 40%"
        >
          40%
        </div>
      </div>
    </div>
  </div>
  <div class="mx-5 mb-5">
    <h1 class="text-left mb-2">Carbs</h1>
    <div class="flex justify-center">
      <div class="bg-gray-200 rounded-full dark:bg-gray-700 w-full">
        <div
          class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full"
          style="width: 20%"
        >
          20%
        </div>
      </div>
    </div>
  </div>
  <div class="mx-5 mb-5">
    <h1 class="text-left mb-2">Fat</h1>
    <div class="flex justify-center">
      <div class="bg-gray-200 rounded-full dark:bg-gray-700 w-full">
        <div
          class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none rounded-full"
          style="width: 73%"
        >
          73%
        </div>
      </div>
    </div>
  </div>
</div>
